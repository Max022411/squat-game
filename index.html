<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深蹲打怪</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 登入畫面 -->
  <section id="loginScreen" class="screen active">
    <div class="login-bg-glow"></div>

    <div class="login-card">
      <div class="game-logo">⚔️</div>
      <h1>深蹲打怪</h1>
      <p>SQUAT HERO ADVENTURE</p>

      <div class="login-form">
        <label>勇者登入</label>
        <input id="nameInput" type="text" placeholder="輸入勇者名稱..." maxlength="12" />
        <button id="startBtn">開始冒險</button>
      </div>

      <div class="login-tip">登入後請允許攝影機權限</div>
    </div>
  </section>

  <!-- 遊戲畫面 -->
  <section id="gameScreen" class="screen">
    <div class="game-wrap">

      <header class="top-bar">
        <div class="player">
          <div class="avatar">⚔️</div>
          <div>
            <div id="playerName">勇者</div>
            <small>LV.1 冒險者</small>
          </div>
        </div>

        <div class="stage">STAGE 1</div>
      </header>

      <main class="battle-card">
        <video id="webcam" autoplay playsinline muted></video>

        <div class="boss-area">
          <div id="boss" class="boss">👾</div>
          <div class="boss-name">暗影史萊姆</div>
        </div>

        <div id="pet" class="pet">🐲</div>

        <div id="hitEffect"></div>
        <div id="floatingText">HIT!</div>

        <div id="cameraStatus">正在開啟鏡頭...</div>

        <div class="guide">
          ⚠️ 請往後退，拍到膝蓋與腳踝
        </div>
      </main>

      <section class="panel">
        <div class="stats">
          <div>
            <span>SCORE</span>
            <strong id="score">0</strong>
          </div>

          <div>
            <span>攻擊能量</span>
            <strong id="energy">0</strong>
          </div>

          <div>
            <span>POWER</span>
            <strong>100%</strong>
          </div>
        </div>

        <div id="combo">COMBO x0</div>

        <div class="hp-title">
          <span>ENEMY HP</span>
          <span id="hpText">100 / 100</span>
        </div>

        <div class="hp-bar">
          <div id="hpFill"></div>
        </div>

        <div class="extra-info">
          <span>🔥 DAILY STREAK：1 DAYS</span>
          <span>超越 87% 冒險者</span>
        </div>
      </section>

      <div class="test-tip">
        測試用：按空白鍵 = 成功深蹲一次
      </div>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
