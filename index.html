<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>深蹲打怪</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050918;
  color: white;
  font-family: "Microsoft JhengHei", Arial, sans-serif;
}

.screen {
  display: none;
  min-height: 100vh;
}

.screen.active {
  display: flex;
}

.center {
  justify-content: center;
  align-items: center;
  text-align: center;
  background:
    radial-gradient(circle at 50% 30%, rgba(0, 217, 255, 0.18), transparent 30%),
    linear-gradient(180deg, #050918, #02040d);
}

h1 {
  font-size: 46px;
  letter-spacing: 8px;
}

.subtitle {
  color: #00d9ff;
  letter-spacing: 5px;
  margin-bottom: 50px;
}

button {
  border: none;
  cursor: pointer;
}

.main-btn {
  width: 240px;
  height: 66px;
  border-radius: 40px;
  background: linear-gradient(135deg, #16c7f3, #3b82f6);
  color: white;
  font-size: 22px;
  font-weight: bold;
  box-shadow: 0 0 24px rgba(0,217,255,0.35);
}

input {
  width: 85%;
  max-width: 420px;
  height: 60px;
  border-radius: 16px;
  background: #111827;
  border: 1px solid rgba(255,255,255,0.25);
  color: white;
  text-align: center;
  font-size: 20px;
  margin-bottom: 24px;
}

/* 地圖 */
#mapScreen {
  justify-content: center;
  background:
    radial-gradient(circle at top, rgba(0,217,255,0.15), transparent 30%),
    linear-gradient(180deg, #050918, #07111f);
}

.map-wrap {
  width: 100%;
  max-width: 430px;
  padding: 24px;
}

.map-title {
  text-align: center;
  color: #ffd400;
  font-size: 28px;
  margin-bottom: 22px;
}

.map {
  position: relative;
  height: 620px;
  border-radius: 30px;
  background: rgba(15,23,42,0.85);
  border: 1px solid rgba(255,255,255,0.12);
  overflow: hidden;
}

.path-line {
  position: absolute;
  width: 4px;
  background: linear-gradient(#00d9ff, #ffd400);
  opacity: 0.45;
  left: 50%;
  top: 40px;
  bottom: 40px;
  transform: translateX(-50%);
}

.stage-node {
  position: absolute;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #1e293b;
  border: 3px solid #00d9ff;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  box-shadow: 0 0 18px rgba(0,217,255,0.35);
}

.stage-node.boss {
  width: 74px;
  height: 74px;
  border-color: #ff3355;
  background: #3b0a20;
  box-shadow: 0 0 28px rgba(255,51,85,0.7);
  font-size: 26px;
}

.stage-node.current {
  border-color: #ffd400;
  box-shadow: 0 0 30px rgba(255,212,0,0.8);
}

.map-tip {
  text-align: center;
  margin-top: 18px;
  color: #94a3b8;
}

/* 遊戲 */
#gameScreen {
  justify-content: center;
  background: #050918;
}

.game {
  width: 100%;
  max-width: 430px;
  padding: 14px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.player {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #11c9ff;
  display: flex;
  align-items: center;
  justify-content: center;
}

#playerName {
  font-weight: bold;
  font-size: 18px;
}

.level {
  color: #00d9ff;
  font-size: 12px;
}

#stageText {
  color: #ffd400;
  font-size: 24px;
  font-weight: bold;
}

.battle {
  position: relative;
  height: 540px;
  border-radius: 28px;
  overflow: hidden;
  background: #111827;
  border: 2px solid rgba(255,255,255,0.13);
}

video, canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

video {
  transform: scaleX(-1);
}

canvas {
  z-index: 2;
}

.monster {
  position: absolute;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 86px;
  z-index: 5;
  filter: drop-shadow(0 0 18px rgba(180,110,255,0.9));
}

.monster.boss-mode {
  font-size: 104px;
  filter: drop-shadow(0 0 26px rgba(255,51,85,1));
}

.pet {
  position: absolute;
  right: 24px;
  bottom: 92px;
  font-size: 58px;
  z-index: 6;
}

.guide {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9;
  width: 85%;
  background: rgba(20,20,30,0.9);
  border: 2px solid #ff3355;
  border-radius: 20px;
  padding: 10px;
  text-align: center;
  font-size: 14px;
}

.status {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9;
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 14px;
  color: #00d9ff;
  font-size: 13px;
}

.effect {
  position: absolute;
  top: 115px;
  left: 50%;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff176, rgba(255,100,0,0.55), transparent 70%);
  opacity: 0;
  z-index: 8;
}

.effect.show {
  animation: boom .5s;
}

.float {
  position: absolute;
  top: 110px;
  left: 50%;
  z-index: 9;
  color: #ffd400;
  font-size: 34px;
  font-weight: bold;
  opacity: 0;
  text-shadow: 0 0 14px #ff6600;
}

.float.show {
  animation: floatText .75s;
}

.monster.hit {
  animation: hit .35s;
}

.pet.attack {
  animation: petJump .45s;
}

.panel {
  margin-top: 12px;
  padding: 18px;
  border-radius: 24px;
  background: #10172a;
  border: 1px solid rgba(255,255,255,0.08);
}

.stats {
  display: flex;
  justify-content: space-around;
  text-align: center;
}

.stats span {
  display: block;
  color: #7e91bd;
  font-size: 12px;
}

.stats strong {
  color: #ffd400;
  font-size: 24px;
}

.combo {
  text-align: center;
  color: #ffd400;
  font-size: 26px;
  font-weight: bold;
  margin: 8px 0;
}

.hp-title {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.hp-bar {
  height: 14px;
  background: #1e293b;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 6px;
}

#hpFill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #4ade80, #00d4ff);
}

.quest {
  margin-top: 10px;
  color: #facc15;
  font-size: 13px;
  text-align: center;
}

.debug {
  margin-top: 8px;
  color: #94a3b8;
  font-size: 12px;
  text-align: center;
}

@keyframes hit {
  0% { transform: translateX(-50%) scale(1); }
  25% { transform: translateX(calc(-50% - 16px)) scale(1.15); }
  50% { transform: translateX(calc(-50% + 16px)) scale(1.15); }
  100% { transform: translateX(-50%) scale(1); }
}

@keyframes petJump {
  0% { transform: translateY(0); }
  50% { transform: translateY(-45px) scale(1.2); }
  100% { transform: translateY(0); }
}

@keyframes boom {
  0% { transform: translateX(-50%) scale(.3); opacity: 1; }
  100% { transform: translateX(-50%) scale(2.2); opacity: 0; }
}

@keyframes floatText {
  0% { transform: translate(-50%,20px); opacity: 0; }
  40% { transform: translate(-50%,0) scale(1.2); opacity: 1; }
  100% { transform: translate(-50%,-55px); opacity: 0; }
}
</style>
</head>

<body>

<section id="homeScreen" class="screen active center">
  <div>
    <h1>深蹲打怪</h1>
    <div class="subtitle">SQUAT HERO ADVENTURE</div>
    <button class="main-btn" id="toLoginBtn">開始冒險</button>
  </div>
</section>

<section id="loginScreen" class="screen center">
  <div>
    <h1>勇者登入</h1>
    <input id="nameInput" placeholder="輸入勇者名稱..." maxlength="12" />
    <br>
    <button class="main-btn" id="toMapBtn">出發！</button>
  </div>
</section>

<section id="mapScreen" class="screen">
  <div class="map-wrap">
    <div class="map-title">探險地圖</div>
    <div class="map">
      <div class="path-line"></div>
      <div id="mapNodes"></div>
    </div>
    <div class="map-tip">每 10 關會出現魔王關 👹</div>
    <br>
    <button class="main-btn" id="startBattleBtn">進入關卡</button>
  </div>
</section>

<section id="gameScreen" class="screen">
  <div class="game">
    <div class="top">
      <div class="player">
        <div class="avatar">⚔️</div>
        <div>
          <div id="playerName">勇者</div>
          <div class="level">LV.1 冒險者</div>
        </div>
      </div>
      <div id="stageText">STAGE 1</div>
    </div>

    <div class="battle">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>

      <div id="cameraStatus" class="status">正在開啟鏡頭...</div>
      <div id="monster" class="monster">👾</div>
      <div id="pet" class="pet">🐲</div>

      <div id="effect" class="effect"></div>
      <div id="floatText" class="float">HIT!</div>

      <div class="guide">⚠️ 手機請直立擺遠一點，拍到肩膀、膝蓋、腳踝</div>
    </div>

    <div class="panel">
      <div class="stats">
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <div><span>攻擊能量</span><strong id="energy">0</strong></div>
        <div><span>深蹲</span><strong id="squatCount">0</strong></div>
      </div>

      <div id="combo" class="combo">COMBO x0</div>

      <div class="hp-title">
        <span id="enemyName">ENEMY HP</span>
        <span id="hpText">100 / 100</span>
      </div>

      <div class="hp-bar">
        <div id="hpFill"></div>
      </div>

      <div class="quest">
        DAILY QUEST：完成 30 次深蹲　🔥 STREAK：1 DAYS
      </div>

      <div id="debug" class="debug">
        偵測狀態：等待骨架...
      </div>
    </div>
  </div>
</section>

<script>
let player = "勇者";
let stage = 1;
let score = 0;
let energy = 0;
let combo = 0;
let squatCount = 0;
let bossHp = 100;
let maxHp = 100;

let squatState = "up";
let lastAttackTime = 0;

const homeScreen = document.getElementById("homeScreen");
const loginScreen = document.getElementById("loginScreen");
const mapScreen = document.getElementById("mapScreen");
const gameScreen = document.getElementById("gameScreen");

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

document.getElementById("toLoginBtn").onclick = () => show(loginScreen);
document.getElementById("toMapBtn").onclick = () => {
  const name = document.getElementById("nameInput").value.trim();
  if (!name) {
    alert("請輸入勇者名稱");
    return;
  }
  player = name;
  document.getElementById("playerName").textContent = player;
  renderMap();
  show(mapScreen);
};

document.getElementById("startBattleBtn").onclick = () => {
  setupStage();
  show(gameScreen);
  startPose();
};

function show(target) {
  [homeScreen, loginScreen, mapScreen, gameScreen].forEach(s => s.classList.remove("active"));
  target.classList.add("active");
}

function renderMap() {
  const box = document.getElementById("mapNodes");
  box.innerHTML = "";

  for (let i = 1; i <= 20; i++) {
    const node = document.createElement("div");
    node.className = "stage-node";
    if (i % 10 === 0) node.classList.add("boss");
    if (i === stage) node.classList.add("current");

    node.textContent = i % 10 === 0 ? "👹" : i;

    const top = 35 + (i - 1) * 28;
    const left = i % 2 === 0 ? 235 : 105;

    node.style.top = top + "px";
    node.style.left = left + "px";

    box.appendChild(node);
  }
}

function setupStage() {
  const isBoss = stage % 10 === 0;

  maxHp = isBoss ? 220 : 100 + stage * 8;
  bossHp = maxHp;

  document.getElementById("stageText").textContent = isBoss ? "BOSS " + stage : "STAGE " + stage;
  document.getElementById("monster").textContent = isBoss ? "👹" : "👾";
  document.getElementById("monster").classList.toggle("boss-mode", isBoss);
  document.getElementById("enemyName").textContent = isBoss ? "BOSS HP" : "ENEMY HP";

  updateUI();
}

async function startPose() {
  const pose = new Pose({
    locateFile: file => "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.45,
    minTrackingConfidence: 0.45
  });

  pose.onResults(onResults);

  const camera = new Camera(video, {
    onFrame: async () => {
      await pose.send({image: video});
    },
    width: 480,
    height: 640
  });

  camera.start();
  document.getElementById("cameraStatus").textContent = "鏡頭偵測中...";
}

function onResults(results) {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.scale(-1, 1);
  ctx.translate(-canvas.width, 0);

  if (results.poseLandmarks) {
    drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {
      color: "#00d9ff",
      lineWidth: 4
    });

    drawLandmarks(ctx, results.poseLandmarks, {
      color: "#ffd400",
      lineWidth: 2
    });

    checkSquat(results.poseLandmarks);
  } else {
    document.getElementById("debug").textContent = "偵測狀態：找不到全身，手機再放遠一點";
  }

  ctx.restore();
}

function checkSquat(lm) {
  const leftHip = lm[23];
  const leftKnee = lm[25];
  const leftAnkle = lm[27];

  const rightHip = lm[24];
  const rightKnee = lm[26];
  const rightAnkle = lm[28];

  const leftVisible = leftHip.visibility > 0.45 && leftKnee.visibility > 0.45 && leftAnkle.visibility > 0.45;
  const rightVisible = rightHip.visibility > 0.45 && rightKnee.visibility > 0.45 && rightAnkle.visibility > 0.45;

  if (!leftVisible && !rightVisible) {
    document.getElementById("debug").textContent = "偵測狀態：膝蓋或腳踝不清楚";
    return;
  }

  let angle;

  if (leftVisible && rightVisible) {
    angle = Math.min(
      getAngle(leftHip, leftKnee, leftAnkle),
      getAngle(rightHip, rightKnee, rightAnkle)
    );
  } else if (leftVisible) {
    angle = getAngle(leftHip, leftKnee, leftAnkle);
  } else {
    angle = getAngle(rightHip, rightKnee, rightAnkle);
  }

  document.getElementById("debug").textContent =
    "膝蓋角度：" + Math.round(angle) + " / 狀態：" + squatState;

  if (squatState === "up" && angle < 135) {
    squatState = "down";
  }

  if (squatState === "down" && angle > 155) {
    const now = Date.now();

    if (now - lastAttackTime > 700) {
      onSquatSuccess();
      lastAttackTime = now;
    }

    squatState = "up";
  }
}

function getAngle(a, b, c) {
  const ab = { x: a.x - b.x, y: a.y - b.y };
  const cb = { x: c.x - b.x, y: c.y - b.y };

  const dot = ab.x * cb.x + ab.y * cb.y;
  const abLen = Math.sqrt(ab.x * ab.x + ab.y * ab.y);
  const cbLen = Math.sqrt(cb.x * cb.x + cb.y * cb.y);

  let cosine = dot / (abLen * cbLen);
  cosine = Math.min(1, Math.max(-1, cosine));

  return Math.acos(cosine) * 180 / Math.PI;
}

function onSquatSuccess() {
  score += 10;
  energy += 1;
  combo += 1;
  squatCount += 1;

  let damage = stage % 10 === 0 ? 10 : 16;

  if (combo % 5 === 0) {
    damage *= 2;
    document.getElementById("floatText").textContent = "CRITICAL!";
  } else {
    document.getElementById("floatText").textContent = "HIT!";
  }

  bossHp -= damage;
  if (bossHp < 0) bossHp = 0;

  updateUI();
  playEffect();

  if (bossHp <= 0) {
    setTimeout(clearStage, 600);
  }
}

function clearStage() {
  alert("關卡通過！前往下一個地圖節點！");
  stage++;
  combo = 0;
  renderMap();
  show(mapScreen);
}

function updateUI() {
  document.getElementById("score").textContent = score;
  document.getElementById("energy").textContent = energy;
  document.getElementById("squatCount").textContent = squatCount;
  document.getElementById("combo").textContent = "COMBO x" + combo;

  document.getElementById("hpText").textContent = bossHp + " / " + maxHp;
  document.getElementById("hpFill").style.width = (bossHp / maxHp * 100) + "%";
}

function playEffect() {
  const monster = document.getElementById("monster");
  const pet = document.getElementById("pet");
  const effect = document.getElementById("effect");
  const floatText = document.getElementById("floatText");

  monster.classList.remove("hit");
  pet.classList.remove("attack");
  effect.classList.remove("show");
  floatText.classList.remove("show");

  void monster.offsetWidth;

  monster.classList.add("hit");
  pet.classList.add("attack");
  effect.classList.add("show");
  floatText.classList.add("show");
}
</script>

</body>
</html>
