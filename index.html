<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 體感深蹲 RPG 遠征</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- MediaPipe AI 姿態辨識套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- 主容器 -->
  <main class="app-container">

    <!-- 1. 登入畫面 -->
    <section id="loginScreen" class="screen active">
      <div class="center-box">
        <h1>⚔️ 聖殿騎士：深蹲遠征</h1>
        <div class="panel">
          <input type="text" id="nameInput" value="勇者" placeholder="請輸入勇者名稱">
          <button id="startBtn" onclick="startGame()">進入勇者大廳</button>
        </div>
      </div>
    </section>

    <!-- 2. 大廳畫面 -->
    <section id="lobbyScreen" class="screen">
      <header>
        <h2>🏰 勇者大廳</h2>
        <div class="panel">
          <p class="user-title"><strong id="lobbyName">勇者</strong></p>
          <p><span id="coinText">🪙 0</span> | <span id="playerLevelText">LV.1 聖殿騎士</span></p>
          <p class="gps-info">🚶 累積行軍：<span id="lobbyWalkDist">0.00</span> km (時速 <span id="lobbyWalkSpeed">0.0</span> km/h)</p>
          <p id="lobbyWalkMsg" class="walk-msg">GPS 初始化中...</p>
        </div>
      </header>

      <nav class="nav-menu">
        <button onclick="openMap()">🗺️ 選擇關卡</button>
        <button onclick="openRole()">⚒️ 皇家鐵匠鋪</button>
        <button onclick="openPets()">🐾 戰寵夥伴</button>
        <button onclick="openGacha()">🔮 聖物寶箱</button>
        <button onclick="openDaily()">📅 每日簽到</button>
      </nav>
    </section>

    <!-- 3. 地圖畫面 -->
    <section id="mapScreen" class="screen">
      <h2>🗺️ 地下城遠征</h2>
      <div class="panel scroll-panel" id="mapNodes"></div>
      <button onclick="showScreen('lobbyScreen')">⬅️ 返回大廳</button>
    </section>

    <!-- 4. 鐵匠鋪裝備畫面 -->
    <section id="roleScreen" class="screen">
      <h2 id="roleTitle">殿堂騎士階級</h2>
      <p id="roleDesc" class="sub-text"></p>
      <button onclick="upgradeRole()" class="action-btn">⬆️ 升級騎士階級</button>
      <div class="panel scroll-panel" id="shopItems"></div>
      <button onclick="showScreen('lobbyScreen')">⬅️ 返回大廳</button>
    </section>

    <!-- 5. 戰寵畫面 -->
    <section id="petScreen" class="screen">
      <h2>🐾 戰寵夥伴</h2>
      <div class="panel scroll-panel" id="petList"></div>
      <button onclick="showScreen('lobbyScreen')">⬅️ 返回大廳</button>
    </section>

    <!-- 6. 抽卡畫面 -->
    <section id="gachaScreen" class="screen">
      <h2>🔮 聖物寶箱</h2>
      <div class="panel center-box">
        <p>消耗 300 🪙 解鎖隨機戰寵夥伴！</p>
        <button onclick="drawGacha()">🎲 祈願開箱 (300🪙)</button>
        <div id="gachaResult" class="gacha-res"></div>
      </div>
      <button onclick="showScreen('lobbyScreen')">⬅️ 返回大廳</button>
    </section>

    <!-- 7. 每日簽到畫面 -->
    <section id="dailyScreen" class="screen">
      <h2>📅 每日簽到</h2>
      <div class="panel scroll-panel" id="dailyList"></div>
      <button onclick="claimDaily()" class="action-btn">🎁 領取本日獎勵</button>
      <button onclick="showScreen('lobbyScreen')">⬅️ 返回大廳</button>
    </section>

    <!-- 8. 體感戰鬥畫面 -->
    <section id="gameScreen" class="screen">
      <header class="game-header">
        <h3 id="stageText">STAGE 1</h3>
        <span id="battleWeaponText" class="sub-info"></span>
      </header>

      <div class="game-view-container">
        <video id="webcam" playsinline></video>
        <canvas id="canvas"></canvas>

        <div class="hud-overlay">
          <div class="hud-top">
            <span id="cameraStatus" class="tag">📷 鏡頭準備中...</span>
            <span id="battlePetLabel" class="pet-tag"></span>
          </div>

          <div class="hp-bar"><div id="hpFill" class="hp-fill"></div></div>
          
          <div class="hud-mid">
            <span id="hpText">100 / 100</span>
            <span id="combo" class="combo-text">COMBO x0</span>
          </div>
          
          <div class="hud-bot">
            <span id="debug">膝蓋角度：--°</span>
            <span id="floatingText" class="dmg-text"></span>
          </div>
        </div>
      </div>

      <button onclick="showScreen('mapScreen')" class="retreat-btn">🏳️ 撤退返回</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
