<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>深蹲打怪</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050918;
  color: white;
  font-family: "Microsoft JhengHei", Arial, sans-serif;
}

.screen {
  display: none;
  min-height: 100vh;
}

.screen.active {
  display: flex;
}

.center {
  justify-content: center;
  align-items: center;
  text-align: center;
  background:
    radial-gradient(circle at 50% 25%, rgba(0, 217, 255, 0.22), transparent 28%),
    radial-gradient(circle at 70% 70%, rgba(255, 214, 10, 0.12), transparent 25%),
    linear-gradient(180deg, #050918, #02040d);
}

.title-box {
  width: 90%;
  max-width: 430px;
  padding: 36px 24px;
}

.logo {
  width: 86px;
  height: 86px;
  margin: 0 auto 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #00d9ff, #3b82f6);
  font-size: 44px;
  box-shadow: 0 0 34px rgba(0, 217, 255, 0.6);
}

h1 {
  margin: 0;
  font-size: 46px;
  letter-spacing: 8px;
}

.subtitle {
  color: #00d9ff;
  letter-spacing: 5px;
  margin: 18px 0 54px;
}

button {
  border: none;
  cursor: pointer;
}

.main-btn {
  width: 240px;
  height: 66px;
  border-radius: 40px;
  background: linear-gradient(135deg, #16c7f3, #3b82f6);
  color: white;
  font-size: 22px;
  font-weight: bold;
  box-shadow: 0 0 24px rgba(0,217,255,0.35);
}

.main-btn:active {
  transform: scale(0.96);
}

input {
  width: 88%;
  max-width: 420px;
  height: 60px;
  border-radius: 18px;
  background: rgba(17, 24, 39, 0.95);
  border: 1px solid rgba(255,255,255,0.25);
  color: white;
  text-align: center;
  font-size: 20px;
  outline: none;
  margin: 30px 0 24px;
}

input:focus {
  border-color: #00d9ff;
  box-shadow: 0 0 18px rgba(0,217,255,0.35);
}

/* 地圖 */
#mapScreen {
  justify-content: center;
  background:
    radial-gradient(circle at top, rgba(0,217,255,0.18), transparent 32%),
    radial-gradient(circle at 80% 80%, rgba(255, 214, 10, 0.1), transparent 28%),
    linear-gradient(180deg, #050918, #07111f);
}

.map-wrap {
  width: 100%;
  max-width: 430px;
  padding: 22px;
}

.map-title {
  text-align: center;
  color: #ffd400;
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 18px;
}

.map-subtitle {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 18px;
  font-size: 14px;
}

.map {
  position: relative;
  height: 620px;
  border-radius: 32px;
  background:
    radial-gradient(circle at 50% 10%, rgba(0,217,255,0.18), transparent 35%),
    linear-gradient(180deg, rgba(15,23,42,0.95), rgba(3,7,18,0.95));
  border: 1px solid rgba(255,255,255,0.14);
  overflow: hidden;
  box-shadow: 0 0 34px rgba(0,0,0,0.45);
}

.map::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 32px 32px;
  opacity: 0.35;
}

.path-line {
  position: absolute;
  width: 5px;
  background: linear-gradient(#00d9ff, #ffd400, #ff3355);
  opacity: 0.45;
  left: 50%;
  top: 42px;
  bottom: 42px;
  transform: translateX(-50%);
  border-radius: 999px;
  box-shadow: 0 0 16px rgba(0,217,255,0.5);
}

.stage-node {
  position: absolute;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #111827;
  border: 3px solid #00d9ff;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  box-shadow: 0 0 18px rgba(0,217,255,0.4);
  z-index: 3;
}

.stage-node.elite {
  width: 76px;
  height: 76px;
  border-color: #ff3355;
  background: radial-gradient(circle, #7f1d1d, #1e1020);
  box-shadow: 0 0 30px rgba(255,51,85,0.8);
  font-size: 28px;
}

.stage-node.current {
  border-color: #ffd400;
  box-shadow: 0 0 34px rgba(255,212,0,0.9);
  animation: pulse 1.4s infinite;
}

.map-footer {
  text-align: center;
  margin-top: 20px;
}

/* 遊戲 */
#gameScreen {
  justify-content: center;
  background:
    radial-gradient(circle at 20% 10%, rgba(0,217,255,0.15), transparent 30%),
    linear-gradient(180deg, #050918, #02040d);
}

.game {
  width: 100%;
  max-width: 430px;
  padding: 14px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 13px;
}

.player {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00d9ff, #3b82f6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 18px rgba(0,217,255,0.45);
}

#playerName {
  font-weight: bold;
  font-size: 18px;
}

.level {
  color: #00d9ff;
  font-size: 12px;
}

#stageText {
  color: #ffd400;
  font-size: 24px;
  font-weight: bold;
}

.battle {
  position: relative;
  height: 540px;
  border-radius: 28px;
  overflow: hidden;
  background: #111827;
  border: 2px solid rgba(255,255,255,0.13);
  box-shadow: 0 0 28px rgba(0,0,0,0.45);
}

video, canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

video {
  transform: scaleX(-1);
}

canvas {
  z-index: 2;
}

.battle::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(3,7,18,0.1), rgba(3,7,18,0.38)),
    radial-gradient(circle at 50% 35%, transparent 35%, rgba(3,7,18,0.28));
  z-index: 3;
  pointer-events: none;
}

.monster {
  position: absolute;
  top: 74px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 86px;
  z-index: 5;
  filter: drop-shadow(0 0 18px rgba(180,110,255,0.9));
}

.monster.elite-mode {
  font-size: 108px;
  filter: drop-shadow(0 0 28px rgba(255,51,85,1));
}

.knight {
  position: absolute;
  right: 26px;
  bottom: 92px;
  font-size: 62px;
  z-index: 6;
  filter: drop-shadow(0 0 18px rgba(0,217,255,0.9));
}

.knight-name {
  position: absolute;
  right: 20px;
  bottom: 72px;
  z-index: 6;
  font-size: 12px;
  color: #dbeafe;
  background: rgba(0,0,0,0.48);
  border-radius: 12px;
  padding: 4px 10px;
}

.guide {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9;
  width: 86%;
  background: rgba(20,20,30,0.9);
  border: 2px solid #ff3355;
  border-radius: 20px;
  padding: 10px;
  text-align: center;
  font-size: 14px;
}

.status {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 9;
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 14px;
  color: #00d9ff;
  font-size: 13px;
}

.effect {
  position: absolute;
  top: 118px;
  left: 50%;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff176, rgba(255,100,0,0.55), transparent 70%);
  opacity: 0;
  z-index: 8;
}

.effect.show {
  animation: boom .5s;
}

.slash {
  position: absolute;
  top: 145px;
  left: 50%;
  width: 160px;
  height: 20px;
  background: linear-gradient(90deg, transparent, #fff, #ffd400, transparent);
  transform: translateX(-50%) rotate(-28deg);
  opacity: 0;
  z-index: 9;
  border-radius: 999px;
  box-shadow: 0 0 18px #ffd400;
}

.slash.show {
  animation: slash .35s;
}

.float {
  position: absolute;
  top: 106px;
  left: 50%;
  z-index: 9;
  color: #ffd400;
  font-size: 34px;
  font-weight: bold;
  opacity: 0;
  text-shadow: 0 0 14px #ff6600;
}

.float.show {
  animation: floatText .75s;
}

.monster.hit {
  animation: hit .35s;
}

.knight.attack {
  animation: knightAttack .45s;
}

.panel {
  margin-top: 12px;
  padding: 18px;
  border-radius: 24px;
  background: #10172a;
  border: 1px solid rgba(255,255,255,0.08);
}

.stats {
  display: flex;
  justify-content: space-around;
  text-align: center;
}

.stats span {
  display: block;
  color: #7e91bd;
  font-size: 12px;
}

.stats strong {
  color: #ffd400;
  font-size: 24px;
}

.combo {
  text-align: center;
  color: #ffd400;
  font-size: 26px;
  font-weight: bold;
  margin: 8px 0;
}

.hp-title {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.hp-bar {
  height: 14px;
  background: #1e293b;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 6px;
}

#hpFill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #4ade80, #00d4ff);
  transition: 0.25s;
}

.quest {
  margin-top: 10px;
  color: #facc15;
  font-size: 13px;
  text-align: center;
}

.debug {
  margin-top: 8px;
  color: #94a3b8;
  font-size: 12px;
  text-align: center;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

@keyframes hit {
  0% { transform: translateX(-50%) scale(1); }
  25% { transform: translateX(calc(-50% - 16px)) scale(1.15); }
  50% { transform: translateX(calc(-50% + 16px)) scale(1.15); }
  100% { transform: translateX(-50%) scale(1); }
}

@keyframes knightAttack {
  0% { transform: translate(0, 0); }
  45% { transform: translate(-70px, -40px) scale(1.2); }
  100% { transform: translate(0, 0); }
}

@keyframes boom {
  0% { transform: translateX(-50%) scale(.3); opacity: 1; }
  100% { transform: translateX(-50%) scale(2.2); opacity: 0; }
}

@keyframes slash {
  0% { opacity: 0; transform: translateX(-50%) rotate(-28deg) scaleX(.2); }
  50% { opacity: 1; transform: translateX(-50%) rotate(-28deg) scaleX(1.2); }
  100% { opacity: 0; transform: translateX(-50%) rotate(-28deg) scaleX(1.7); }
}

@keyframes floatText {
  0% { transform: translate(-50%,20px); opacity: 0; }
  40% { transform: translate(-50%,0) scale(1.2); opacity: 1; }
  100% { transform: translate(-50%,-55px); opacity: 0; }
}
</style>
</head>

<body>

<section id="homeScreen" class="screen active center">
  <div class="title-box">
    <div class="logo">⚔️</div>
    <h1>深蹲打怪</h1>
    <div class="subtitle">SQUAT HERO ADVENTURE</div>
    <button class="main-btn" id="toLoginBtn">開始冒險</button>
  </div>
</section>

<section id="loginScreen" class="screen center">
  <div class="title-box">
    <div class="logo">🛡️</div>
    <h1>勇者登入</h1>
    <input id="nameInput" placeholder="輸入勇者名稱..." maxlength="12" />
    <br>
    <button class="main-btn" id="toMapBtn">出發！</button>
  </div>
</section>

<section id="mapScreen" class="screen">
  <div class="map-wrap">
    <div class="map-title">探險地圖</div>
    <div class="map-subtitle">選擇目前節點，準備進入戰鬥</div>

    <div class="map">
      <div class="path-line"></div>
      <div id="mapNodes"></div>
    </div>

    <div class="map-footer">
      <button class="main-btn" id="startBattleBtn">進入關卡</button>
    </div>
  </div>
</section>

<section id="gameScreen" class="screen">
  <div class="game">
    <div class="top">
      <div class="player">
        <div class="avatar">⚔️</div>
        <div>
          <div id="playerName">勇者</div>
          <div class="level">LV.1 冒險者</div>
        </div>
      </div>
      <div id="stageText">STAGE 1</div>
    </div>

    <div class="battle">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>

      <div id="cameraStatus" class="status">正在開啟鏡頭...</div>
      <div id="monster" class="monster">👾</div>

      <div id="knight" class="knight">🤺</div>
      <div class="knight-name">騎士夥伴</div>

      <div id="effect" class="effect"></div>
      <div id="slash" class="slash"></div>
      <div id="floatText" class="float">HIT!</div>

      <div class="guide">⚠️ 手機請直立擺遠一點，拍到肩膀、膝蓋、腳踝</div>
    </div>

    <div class="panel">
      <div class="stats">
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <div><span>攻擊能量</span><strong id="energy">0</strong></div>
        <div><span>深蹲</span><strong id="squatCount">0</strong></div>
      </div>

      <div id="combo" class="combo">COMBO x0</div>

      <div class="hp-title">
        <span id="enemyName">ENEMY HP</span>
        <span id="hpText">100 / 100</span>
      </div>

      <div class="hp-bar">
        <div id="hpFill"></div>
      </div>

      <div class="quest">
        DAILY QUEST：完成 30 次深蹲　🔥 STREAK：1 DAYS
      </div>

      <div id="debug" class="debug">
        偵測狀態：等待骨架...
      </div>
    </div>
  </div>
</section>

<script>
let player = "勇者";
let stage = 1;
let score = 0;
let energy = 0;
let combo = 0;
let squatCount = 0;
let bossHp = 100;
let maxHp = 100;

let squatState = "up";
let lastAttackTime = 0;
let poseStarted = false;

const homeScreen = document.getElementById("homeScreen");
const loginScreen = document.getElementById("loginScreen");
const mapScreen = document.getElementById("mapScreen");
const gameScreen = document.getElementById("gameScreen");

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

document.getElementById("toLoginBtn").onclick = () => show(loginScreen);

document.getElementById("toMapBtn").onclick = () => {
  const name = document.getElementById("nameInput").value.trim();

  if (!name) {
    alert("請輸入勇者名稱");
    return;
  }

  player = name;
  document.getElementById("playerName").textContent = player;
  renderMap();
  show(mapScreen);
};

document.getElementById("startBattleBtn").onclick = () => {
  setupStage();
  show(gameScreen);

  if (!poseStarted) {
    poseStarted = true;
    startPose();
  }
};

function show(target) {
  [homeScreen, loginScreen, mapScreen, gameScreen].forEach(s => {
    s.classList.remove("active");
  });

  target.classList.add("active");
}

function renderMap() {
  const box = document.getElementById("mapNodes");
  box.innerHTML = "";

  for (let i = 1; i <= 20; i++) {
    const node = document.createElement("div");

    node.className = "stage-node";

    if (i % 10 === 0) {
      node.classList.add("elite");
    }

    if (i === stage) {
      node.classList.add("current");
    }

    node.textContent = i % 10 === 0 ? "👑" : i;

    const top = 35 + (i - 1) * 28;
    const left = i % 2 === 0 ? 235 : 105;

    node.style.top = top + "px";
    node.style.left = left + "px";

    box.appendChild(node);
  }
}

function setupStage() {
  const isElite = stage % 10 === 0;

  maxHp = isElite ? 240 : 100 + stage * 8;
  bossHp = maxHp;

  document.getElementById("stageText").textContent = "STAGE " + stage;
  document.getElementById("monster").textContent = isElite ? "👹" : "👾";
  document.getElementById("monster").classList.toggle("elite-mode", isElite);
  document.getElementById("enemyName").textContent = isElite ? "ELITE HP" : "ENEMY HP";

  updateUI();
}

async function startPose() {
  const pose = new Pose({
    locateFile: file => "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.45,
    minTrackingConfidence: 0.45
  });

  pose.onResults(onResults);

  const camera = new Camera(video, {
    onFrame: async () => {
      await pose.send({ image: video });
    },
    width: 480,
    height: 640
  });

  camera.start();
  document.getElementById("cameraStatus").textContent = "鏡頭偵測中...";
}

function onResults(results) {
  canvas.width = video.videoWidth || 480;
  canvas.height = video.videoHeight || 640;

  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.scale(-1, 1);
  ctx.translate(-canvas.width, 0);

  if (results.poseLandmarks) {
    drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {
      color: "#00d9ff",
      lineWidth: 4
    });

    drawLandmarks(ctx, results.poseLandmarks, {
      color: "#ffd400",
      lineWidth: 2
    });

    checkSquat(results.poseLandmarks);
  } else {
    document.getElementById("debug").textContent =
      "偵測狀態：找不到全身，手機再放遠一點";
  }

  ctx.restore();
}

function checkSquat(lm) {
  const leftHip = lm[23];
  const leftKnee = lm[25];
  const leftAnkle = lm[27];

  const rightHip = lm[24];
  const rightKnee = lm[26];
  const rightAnkle = lm[28];

  const leftVisible =
    leftHip.visibility > 0.4 &&
    leftKnee.visibility > 0.4 &&
    leftAnkle.visibility > 0.4;

  const rightVisible =
    rightHip.visibility > 0.4 &&
    rightKnee.visibility > 0.4 &&
    rightAnkle.visibility > 0.4;

  if (!leftVisible && !rightVisible) {
    document.getElementById("debug").textContent =
      "偵測狀態：膝蓋或腳踝不清楚";
    return;
  }

  let angle;

  if (leftVisible && rightVisible) {
    angle = Math.min(
      getAngle(leftHip, leftKnee, leftAnkle),
      getAngle(rightHip, rightKnee, rightAnkle)
    );
  } else if (leftVisible) {
    angle = getAngle(leftHip, leftKnee, leftAnkle);
  } else {
    angle = getAngle(rightHip, rightKnee, rightAnkle);
  }

  document.getElementById("debug").textContent =
    "膝蓋角度：" + Math.round(angle) + " / 狀態：" + squatState;

  if (squatState === "up" && angle < 140) {
    squatState = "down";
  }

  if (squatState === "down" && angle > 155) {
    const now = Date.now();

    if (now - lastAttackTime > 700) {
      onSquatSuccess();
      lastAttackTime = now;
    }

    squatState = "up";
  }
}

function getAngle(a, b, c) {
  const ab = {
    x: a.x - b.x,
    y: a.y - b.y
  };

  const cb = {
    x: c.x - b.x,
    y: c.y - b.y
  };

  const dot = ab.x * cb.x + ab.y * cb.y;
  const abLen = Math.sqrt(ab.x * ab.x + ab.y * ab.y);
  const cbLen = Math.sqrt(cb.x * cb.x + cb.y * cb.y);

  let cosine = dot / (abLen * cbLen);
  cosine = Math.min(1, Math.max(-1, cosine));

  return Math.acos(cosine) * 180 / Math.PI;
}

function onSquatSuccess() {
  score += 10;
  energy += 1;
  combo += 1;
  squatCount += 1;

  let damage = stage % 10 === 0 ? 10 : 16;

  if (combo % 5 === 0) {
    damage *= 2;
    document.getElementById("floatText").textContent = "CRITICAL!";
  } else {
    document.getElementById("floatText").textContent = "SLASH!";
  }

  bossHp -= damage;
  if (bossHp < 0) bossHp = 0;

  updateUI();
  playEffect();

  if (bossHp <= 0) {
    setTimeout(clearStage, 600);
  }
}

function clearStage() {
  alert("關卡通過！前往下一個地圖節點！");
  stage += 1;
  combo = 0;
  renderMap();
  show(mapScreen);
}

function updateUI() {
  document.getElementById("score").textContent = score;
  document.getElementById("energy").textContent = energy;
  document.getElementById("squatCount").textContent = squatCount;
  document.getElementById("combo").textContent = "COMBO x" + combo;

  document.getElementById("hpText").textContent = bossHp + " / " + maxHp;
  document.getElementById("hpFill").style.width =
    (bossHp / maxHp * 100) + "%";
}

function playEffect() {
  const monster = document.getElementById("monster");
  const knight = document.getElementById("knight");
  const effect = document.getElementById("effect");
  const slash = document.getElementById("slash");
  const floatText = document.getElementById("floatText");

  monster.classList.remove("hit");
