<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Fitness RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">

    <header class="top-bar">
      <div class="player-info">
        <div class="avatar">⚔️</div>
        <div>
          <div class="player-name">666</div>
          <div class="player-level">LV.1 冒險者</div>
        </div>
      </div>

      <div class="stage-title">DUNGEON 1</div>
    </header>

    <main class="battle-area">

      <video id="webcam" autoplay playsinline></video>

      <canvas id="poseCanvas"></canvas>

      <img id="boss" src="boss.png" alt="Boss">

      <img id="pet" src="pet.png" alt="Pet">

      <div id="hitEffect"></div>

      <div id="floatingText">CRITICAL!</div>

      <div id="warningText">
        ⚠️ 請往後退，拍到膝蓋與腳踝
      </div>

    </main>

    <section class="status-panel">

      <div class="status-row">
        <div>
          <div class="label">BATTLE SCORE</div>
          <div id="score" class="value">0</div>
        </div>

        <div>
          <div class="label">ATTACK ENERGY</div>
          <div id="energy" class="value">0</div>
        </div>

        <div>
          <div class="label">MANA</div>
          <div id="power" class="value">100%</div>
        </div>
      </div>

      <div id="combo" class="combo">COMBO x0</div>

      <div class="hp-title">
        <span>BOSS HP</span>
        <span id="bossHpText">100 / 100</span>
      </div>

      <div class="hp-bar">
        <div id="bossHpBar"></div>
      </div>

      <div class="daily-box">
        🔥 DAILY STREAK：<span id="streak">1</span> DAYS
      </div>

      <div class="rank-box">
        你今天超越了 <span id="rankPercent">87%</span> 的冒險者
      </div>

    </section>

  </div>

  <audio id="hitSound" src="hit.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
